- name: Install Zabbix Agent
  ansible.builtin.apt:
    name: zabbix-agent
    state: present
    update_cache: true

- name: Configure Zabbix Agent
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "Server", value: "{{ hostvars['zabbix']['ansible_host'] }}" }
    - { key: "ServerActive", value: "{{ hostvars['zabbix']['ansible_host'] }}" }
    - { key: "Hostname", value: "{{ inventory_hostname }}" }
  notify: Restart Zabbix-agent

- name: Ensure Zabbix Agent is running
  ansible.builtin.systemd:
    name: zabbix-agent
    state: restarted
    enabled: true
