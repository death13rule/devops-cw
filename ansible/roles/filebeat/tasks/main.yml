- name: Install Filebeat
  ansible.builtin.apt:
    deb: "https://mirror.yandex.ru/mirrors/elastic/7/pool/main/f/filebeat/filebeat-7.15.1-amd64.deb"

- name: Filebeat config copy
  ansible.builtin.template:
    src: "{{ role_path }}/files/filebeat.j2"
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: '0600'

- name: Enable Nginx module in Filebeat
  ansible.builtin.command: filebeat modules enable nginx
  args:
    creates: /etc/filebeat/modules.d/nginx.yml.enabled
  notify: Restart Filebeat
