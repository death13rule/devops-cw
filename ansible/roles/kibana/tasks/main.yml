- name: Install Kibana
  ansible.builtin.apt:
    deb: "https://mirror.yandex.ru/mirrors/elastic/7/pool/main/k/kibana/kibana-7.15.1-amd64.deb"

- name: Configure Kibana
  ansible.builtin.lineinfile:
    path: /etc/kibana/kibana.yml
    regexp: "^#?{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
  loop:
    - { key: "server.host", value: '"0.0.0.0"' }
    - { key: "elasticsearch.hosts", value: '["http://{{ hostvars["elasticsearch"]["ansible_host"] }}:9200"]' }
    - { key: "i18n.locale", value: '"ru"' }
  notify: Restart Kibana

- name: Start and enable Kibana
  ansible.builtin.systemd:
    name: kibana
    state: started
    enabled: true
    daemon_reload: true
